version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    allow:
      - dependency-type: all
    groups:
      python-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["setuptools"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      hook-version-updates:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      action-version-updates:
        applies-to: version-updates
        patterns: ["*"]
