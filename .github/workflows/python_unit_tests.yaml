name: Python Unit Tests

on:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python_unit_tests.yaml'
  push:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python_unit_tests.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # Required to evaluate the event trigger metadata safely

jobs:
  python_unit_tests:
    name: python_unit_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv with Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Test with pytest
        run: |
          # Setup git for git_bdiff and get_git_sources testing
          git config --global user.name 'Testing'
          git config --global user.email 'Testing'
          uv run --frozen --extra test pytest -vv
