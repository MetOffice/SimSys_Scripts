# Run the same pre-commit checks used locally.
name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'releases/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv with Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: false

      - name: Install quality tools
        run: uv sync --frozen --extra dev

      - name: Check changed files
        if: github.event_name != 'workflow_dispatch'
        env:
          FROM_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO_REF: ${{ github.sha }}
        run: |
          if [[ "$FROM_REF" =~ ^0+$ ]]; then
            uv run --frozen --extra dev pre-commit run --hook-stage manual --all-files --show-diff-on-failure
          else
            uv run --frozen --extra dev pre-commit run --hook-stage manual --from-ref "$FROM_REF" --to-ref "$TO_REF" --show-diff-on-failure
          fi

      - name: Audit all files
        if: github.event_name == 'workflow_dispatch'
        run: uv run --frozen --extra dev pre-commit run --hook-stage manual --all-files --show-diff-on-failure
...
