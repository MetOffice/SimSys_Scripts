[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simsys_scripts"
version = "2026.11.1"
description = "Development support scripts for Simulation Systems deployment"
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.12"

dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.4",
    "rumdl==0.3.2"
]
test = [
    "pytest==9.2.0",
    "networkx==3.7",
    "PyYAML==6.0.3"
]

[project.urls]
repository = "https://github.com/MetOffice/SimSys_Scripts"
discussion = "https://github.com/MetOffice/simulation-systems/discussions"

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*.conf.py", ".svn"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.rumdl]
respect-gitignore = true
