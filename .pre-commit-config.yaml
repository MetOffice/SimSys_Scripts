minimum_pre_commit_version: '4.7.0'
exclude: |
  (?x)(
    ^script_copyright_checker/file/
    | ^script_umdp3_checker/tests/example_fortran_code\.F90$
    | (^|/)([^/]+\.conf\.py|pull_request_template\.md)$
  )

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: rumdl
        name: Markdown lint
        entry: rumdl check --fix
        language: system
        types: [markdown]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        types: [shell]
        args: ["--source-path=SCRIPTDIR"]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        files: '(^|/)(\.github/(workflows/[^/]+|zizmor|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$'
        pass_filenames: false
        args: ["--no-progress", "--offline", "--config", ".github/zizmor.yml", "."]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in Git history
        entry: gitleaks git --redact --verbose
        stages: [manual]
